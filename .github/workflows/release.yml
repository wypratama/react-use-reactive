name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump or recovery mode'
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - premajor-beta
          - prerelease-beta
          - publish-existing-beta
        default: auto

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve existing beta for publish recovery
        if: inputs.version == 'publish-existing-beta'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-beta.*) ;;
            *)
              echo "Refusing publish recovery for non-beta version: $VERSION"
              exit 1
              ;;
          esac

          TAG="v$VERSION"
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          git checkout --detach "$TAG"

          TAG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag $TAG contains package version $TAG_VERSION, expected $VERSION"
            exit 1
          fi

          echo "Publishing exact tagged source: $TAG"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run lint
          npm run typecheck
          npm run check:types
          npm test
          npm run lint:pack
          npm run check:pack

      - name: Bump version and create tag
        if: inputs.version != 'publish-existing-beta'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ inputs.version }}" in
            auto)  npx changelogen --release --push ;;
            patch) npx changelogen --patch --release --push ;;
            minor) npx changelogen --minor --release --push ;;
            major) npx changelogen --major --release --push ;;
            premajor-beta) npx changelogen --premajor beta --release --push ;;
            prerelease-beta) npx changelogen --prerelease beta --release --push ;;
          esac

      - name: Create GitHub Release
        if: inputs.version != 'publish-existing-beta'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx changelogen gh release

      - name: Mark GitHub beta release as prerelease
        if: inputs.version == 'premajor-beta' || inputs.version == 'prerelease-beta' || inputs.version == 'publish-existing-beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v$VERSION" --prerelease

      - name: Publish to npm (Trusted Publishing)
        run: |
          case "${{ inputs.version }}" in
            premajor-beta|prerelease-beta|publish-existing-beta) npm publish --tag beta ;;
            *) npm publish ;;
          esac
