name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, type-check, test, and verify package (React 19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check (JSDoc)
        run: npm run typecheck
      - name: Verify generated declarations are up to date
        run: npm run check:types
      - name: Test
        run: npm test
      - name: Validate package metadata
        run: npm run lint:pack
      - name: Verify package contents and entry point
        run: npm run check:pack

  test-react-18:
    name: Test against React 18
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Swap React 19 for React 18
        run: npm install --no-save react@18.3.1 react-dom@18.3.1 @types/react@18.3.12
      - name: Test
        run: npm test
