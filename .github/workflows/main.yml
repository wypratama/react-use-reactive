name: CI
on: [push]
jobs:
  build:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Lint
        run: npx oxlint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run