name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    name: Lint, type-check, test, and verify package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check (JSDoc)
        run: npm run typecheck
      - name: Verify generated declarations are up to date
        run: npm run check:types
      - name: Test
        run: npm test
      - name: Validate package metadata
        run: npm run lint:pack
      - name: Verify package contents and entry point
        run: npm run check:pack